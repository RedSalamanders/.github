name: Explicit native qualification
on:
  workflow_call:
    inputs:
      engine_ref:
        type: string
        required: true
      configuration:
        type: string
        default: Debug
      scope:
        type: string
        default: Normal
      platform:
        type: string
        default: All
permissions:
  contents: read
jobs:
  select-platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select the requested qualification architectures
        id: select
        shell: pwsh
        env:
          CI_QUALIFICATION_PLATFORM: ${{ inputs.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $platforms = switch -CaseSensitive ($env:CI_QUALIFICATION_PLATFORM) {
            'All' { @('x64','ARM64') }
            'x64' { @('x64') }
            'ARM64' { @('ARM64') }
            default { throw 'Qualification platform must be All, x64 or ARM64.' }
          }
          $entries = @($platforms | ForEach-Object {
            @{ platform=$_; runner=$(if ($_ -ceq 'x64') {'windows-2025-vs2026'} else {'windows-11-vs2026-arm'}) }
          })
          $matrix = @{ include=$entries } | ConvertTo-Json -Depth 3 -Compress
          "matrix=$matrix" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
  native:
    needs: select-platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Enable long Windows checkout paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RedSalamanders/.github
          ref: ${{ inputs.engine_ref }}
          path: .ci-engine
          persist-credentials: false
      - uses: ./.github/actions/setup-msvc
        with:
          platform: ${{ matrix.platform }}
      - name: Freeze an explicit qualification identity, without advancing main state
        shell: pwsh
        run: |
          Import-Module ./.ci-engine/Tools/Modules/Ci.Policy.psm1
          $batch = New-CiInputDescriptor -Root .
          $batch.runId = $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Path .build/ci -Force | Out-Null
          $batch | ConvertTo-Json -Depth 15 | Set-Content -LiteralPath .build/ci/manual.json -Encoding utf8
      - name: Restore ABI-indexed dependency packages
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ci/vcpkg-cache
          key: ci-deps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ inputs.engine_ref }}-${{ hashFiles('.ci/project.json', 'Build/**', 'Tools/**', '*.ps1', '**/*.props', '**/*.targets', '**/vcpkg*.json', '**/*lock.json', '.github/actions/setup-msvc/**') }}
          restore-keys: |
            ci-deps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
      - name: Build and execute the selected native diagnostic profile
        id: qualification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CONFIGURATION: ${{ inputs.configuration }}
          CI_QUALIFICATION_SCOPE: ${{ inputs.scope }}
          CI_PLATFORM: ${{ matrix.platform }}
          CI: 'true'
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.build/ci/vcpkg-cache,readwrite
        run: |
          $manifest = Get-Content .ci/project.json -Raw | ConvertFrom-Json
          & (Join-Path $PWD $manifest.adapter) -Phase Qualification -Configuration $env:CI_CONFIGURATION -QualificationScope $env:CI_QUALIFICATION_SCOPE -Platform $env:CI_PLATFORM -EngineRoot (Join-Path $PWD '.ci-engine') -Descriptor .build/ci/manual.json
      - name: Save dependency packages after successful diagnostic qualification
        if: steps.qualification.outcome == 'success' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ci/vcpkg-cache
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - if: always() && steps.qualification.outputs.evidence_directory != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ matrix.platform }}-${{ inputs.configuration }}
          path: ${{ steps.qualification.outputs.evidence_directory }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-workspace-${{ matrix.platform }}-${{ inputs.configuration }}
          path: |
            .build/logs/**
            .build/reports/**
            .build/evidence/**
            .build/test-runs/**
            .build/test-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
