name: Shared CI engine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  behavior:
    name: engine behavior (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Enable long Windows checkout paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow syntax and compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Tools/Test-Workflows.ps1 -Root .
      - name: Behavioral policy, admission and formatting controls
        shell: pwsh
        run: ./Tests/Test-Engine.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'unified-ci-tests')
      - name: Compiler-free dependency metadata behavior controls
        shell: pwsh
        run: ./Tests/Test-DependencyStatus.ps1
      - name: Preserve engine behavior evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-behavior-${{ matrix.os }}
          path: ${{ runner.temp }}/unified-ci-tests/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
