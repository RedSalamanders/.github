name: Dependency metadata inventory
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe six exact source trees and custom pins without builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NATIVE_BUILDS_DISABLED: 'true'
        run: ./Tools/Get-DependencyStatus.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'dependency-status')
      - name: Preserve the inventory, limitations and update advisories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-status
          path: ${{ runner.temp }}/dependency-status/
          if-no-files-found: error
          retention-days: 90
