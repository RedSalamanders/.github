name: SDK artifact access capability
on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Successful DxUi main qualification run to inspect
        type: string
        required: true
      artifact_name:
        description: Qualified SDK artifact to inspect without downloading its contents
        type: choice
        options: [production-x64, production-ARM64]
        default: production-x64
permissions:
  contents: read
  actions: read
jobs:
  access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check repository-scoped token access to the public producer artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_PRODUCER_RUN: ${{ inputs.producer_run }}
          SDK_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'sdk-artifact-access'
          [void][IO.Directory]::CreateDirectory($root)
          $report = [ordered]@{
            schemaVersion=1; capability='cross-repository-sdk-artifact-access'; producer='RedSalamanders/DxUi'
            consumer=$env:GITHUB_REPOSITORY; tokenKind='repository-scoped GITHUB_TOKEN'; tokenPermissions='contents:read,actions:read'
            observedUtc=[DateTime]::UtcNow.ToString('o'); confirmed=$false; phase='input'; httpStatus=0
            producerRunId=$env:SDK_PRODUCER_RUN; artifactName=$env:SDK_ARTIFACT_NAME
          }
          $handler = [Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [Net.Http.HttpClient]::new($handler)
          $client.Timeout = [TimeSpan]::FromSeconds(30)
          $client.DefaultRequestHeaders.UserAgent.ParseAdd('RedSalamanders-I61-ArtifactAccess')
          $client.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
          $client.DefaultRequestHeaders.Add('X-GitHub-Api-Version','2022-11-28')
          $client.DefaultRequestHeaders.Authorization = [Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer',$env:GH_TOKEN)
          function Read-ProducerJson([string]$Suffix) {
            $response = $client.GetAsync('https://api.github.com/repos/RedSalamanders/DxUi/'+$Suffix).GetAwaiter().GetResult()
            try {
              $report.httpStatus = [int]$response.StatusCode
              if (-not $response.IsSuccessStatusCode) { throw 'Producer API access refused.' }
              return $response.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json
            } finally { $response.Dispose() }
          }
          try {
            if ($env:SDK_PRODUCER_RUN -cnotmatch '^[1-9][0-9]{0,19}$' -or $env:SDK_ARTIFACT_NAME -cnotin @('production-x64','production-ARM64')) { throw 'Invalid capability probe inputs.' }
            $report.phase = 'qualified-run-metadata'
            $run = Read-ProducerJson ('actions/runs/'+$env:SDK_PRODUCER_RUN)
            if ($run.repository.full_name -cne 'RedSalamanders/DxUi' -or $run.head_branch -cne 'main' -or
                $run.path -cne '.github/workflows/qualify.yml' -or $run.event -cne 'workflow_dispatch' -or
                $run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'The producer run is not a successful main qualification.' }
            $report.sourceCommit = $run.head_sha
            $report.phase = 'artifact-metadata'
            $listing = Read-ProducerJson ('actions/runs/'+$env:SDK_PRODUCER_RUN+'/artifacts?per_page=100')
            $artifacts = @($listing.artifacts | Where-Object { $_.name -ceq $env:SDK_ARTIFACT_NAME })
            if ($artifacts.Count -ne 1 -or $artifacts[0].expired -or $artifacts[0].size_in_bytes -le 0 -or
                $artifacts[0].workflow_run.id -ne $run.id -or $artifacts[0].workflow_run.head_sha -cne $run.head_sha) { throw 'No unique current artifact matches the qualified source.' }
            $artifact = $artifacts[0]
            $report.artifactId = $artifact.id
            $report.artifactDigest = $artifact.digest
            $report.artifactBytes = $artifact.size_in_bytes
            $report.phase = 'download-authorization'
            # Do not follow or publish the short-lived signed URL, and never expose the token.
            $response = $client.GetAsync('https://api.github.com/repos/RedSalamanders/DxUi/actions/artifacts/'+$artifact.id+'/zip').GetAwaiter().GetResult()
            try {
              $report.httpStatus = [int]$response.StatusCode
              $report.confirmed = $response.StatusCode -eq [Net.HttpStatusCode]::Found -and $null -ne $response.Headers.Location -and $response.Headers.Location.Scheme -ceq 'https'
            } finally { $response.Dispose() }
            $report.phase = 'completed'
          } finally {
            $client.Dispose()
            [IO.File]::WriteAllText((Join-Path $root 'capability.json'),($report | ConvertTo-Json -Depth 5),[Text.UTF8Encoding]::new($false))
            Write-Host ('SDK artifact access: confirmed='+$report.confirmed+' phase='+$report.phase+' status='+$report.httpStatus)
          }
          if (-not $report.confirmed) { throw 'Cross-repository SDK artifact download is unavailable with this repository-scoped token. Existing source-build fallback remains required.' }
      - name: Retain capability result without credentials or signed URLs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-artifact-access
          path: ${{ runner.temp }}/sdk-artifact-access/
          if-no-files-found: error
          retention-days: 14
