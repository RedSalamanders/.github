name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to recheck after an explicit formatting commit
        type: string
        required: true
      expected_head:
        description: Exact new PR head SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main-coordinator' || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      check_id: ${{ steps.pr.outputs.check_id }}
    steps:
      - name: Enable long Windows checkout paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RedSalamanders/.github
          ref: @ENGINE@
          path: .ci-engine
          persist-credentials: false
      - id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR: ${{ inputs.pr_number }}
          CI_HEAD: ${{ inputs.expected_head }}
        run: ./.ci-engine/Tools/Resolve-PrCheck.ps1 -PullRequest $env:CI_PR -ExpectedHead $env:CI_HEAD
  checks:
    needs: resolve
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success'))
    uses: RedSalamanders/.github/.github/workflows/pr.yml@@ENGINE@
    with:
      engine_ref: @ENGINE@
      head: ${{ github.event.pull_request.head.sha || needs.resolve.outputs.head }}
      base: ${{ github.event.pull_request.base.sha || needs.resolve.outputs.base }}
    permissions:
      contents: read
  report:
    needs: [resolve, checks]
    if: always() && github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - name: Enable long Windows checkout paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RedSalamanders/.github
          ref: @ENGINE@
          path: .ci-engine
          persist-credentials: false
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_ID: ${{ needs.resolve.outputs.check_id }}
          CI_RESULT: ${{ needs.checks.result }}
        run: ./.ci-engine/Tools/Complete-PrCheck.ps1 -CheckId $env:CI_CHECK_ID -Result $env:CI_RESULT
  coordinate:
    if: github.event_name == 'push'
    uses: RedSalamanders/.github/.github/workflows/coordinate.yml@@ENGINE@
    with:
      engine_ref: @ENGINE@
    permissions:
      contents: read
      statuses: write
      actions: write
